twig:
    default_path: '%kernel.project_dir%/templates'
    file_name_pattern: '*.twig'

    globals:
        site_url: '%env(API_SITE_URL)%'
        site_name: '%env(API_SITE_NAME)%'
        internal_site_url: '%env(INTERNAL_SITE_URL)%'
when@dev:
    twig:
        strict_variables: true

when@test:
    twig:
        strict_variables: true

