framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async_outbox:
                dsn: 'doctrine://default?auto_setup=false'
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    exchange:
                        name: domain_events
                        type: topic
                    queues:
                        app_domain_events_queue:
                            binding_keys: ['#']
                retry_strategy:
                    max_retries: 3
                    delay: 1000
            sync: 'sync://'
            failed: 'doctrine://default?queue_name=failed&auto_setup=false'


        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            'App\Auth\Event\PasswordResetRequested': async_outbox
            'App\Auth\Event\UserRemoved': async_outbox
            'App\Auth\Event\PasswordReset': async_outbox
            'App\Auth\Event\UserCreated': async_outbox
            'App\Auth\Event\JoinByEmailRequested': async_outbox
            'App\Auth\Event\UserRoleChanged': async_outbox
            'App\Auth\Event\UserJoinConfirmed': async_outbox
            'App\Auth\Event\NetworkAttached': async_outbox
            'App\Auth\Event\ChangeEmailRequested': async_outbox
            'App\Auth\Event\PasswordChanged': async_outbox
            'App\Auth\Event\GuestJoined': async_outbox
            'App\Auth\Event\MagicLinkRequested': async_outbox
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async_outbox

            'App\Parser\Event\ParserCreated': async_outbox
            'App\Parser\Event\ParseLaunched': async_outbox
            'App\Parser\Event\ParseFailed': async_outbox
            'App\Parser\Event\ParseEnded': async_outbox

            'App\Course\Event\CourseProcessed': async_outbox
            'App\Course\Event\CourseScheduledToRender': async_outbox
            'App\Course\Event\CourseRendered': async_outbox
            'App\Course\Event\QuestionsProtected': async_outbox

            'App\Testing\Event\TestCreated': async_outbox
            'App\Testing\Event\TestActivated': async_outbox
            'App\Testing\Event\TestDeactivated': async_outbox
            'App\Testing\Event\TestRemoved': async_outbox
            'App\Testing\Event\TestChanged': async_outbox

            'App\Testing\Event\Attempt\TimeoutAttemptCommand': async_outbox
            'App\Profile\Event\ProfileRemoved': async_outbox
            'App\Profile\Event\ProfileAdded': async_outbox

            'App\Subscription\Event\Subscription\SubscriptionPurchased': async_outbox
            'App\Subscription\Command\ConfirmPayment\Command': sync
            'App\Subscription\Command\FailPayment\Command': sync

            'App\Testing\Command\Attempt\Launch\Command': sync
            'App\Testing\Command\Attempt\DemoLaunch\Command': sync

            'App\CourseAnswers\Command\Product\Send\Command': sync
            'App\CourseAnswers\Event\RecipientCreated': async_outbox
            'App\CourseAnswers\Command\Payment\Confirm\Command': sync
            'App\CourseAnswers\Command\Payment\Fail\Command': sync

when@test:
    framework:
        messenger:
            transports:
            # replace with your transport name here (e.g., my_transport: 'in-memory://')
            # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
                async_outbox: 'in-memory://'
                async: 'in-memory://'
                sync: 'sync://'
            routing:
                'App\Subscription\Command\Activate\Command': sync
                'App\Course\Event\CourseScheduledToRender': sync
