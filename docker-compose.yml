      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URL: "http://localhost:3000/join/callback/google"
      ENCRYPT_SECRET_KEY: flaaim-secret
    command: php bin/console messenger:consume async --limit=1000 --memory-limit=128M -vv
    restart: always
