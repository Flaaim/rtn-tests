doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            auth_user_id: App\Auth\Entity\User\IdType
            user_email: App\Auth\Entity\User\EmailType
            user_status: App\Auth\Entity\User\StatusType
            user_role: App\Auth\Entity\User\RoleType

            parser_id: App\Parser\Entity\Parser\ParserIdType
            parser_host: App\Parser\Entity\Parser\HostType
            task_id: App\Parser\Entity\Task\TaskIdType
            task_status: App\Parser\Entity\Task\StatusType

            course_id: App\Course\Entity\Course\CourseIdType
            course_status: App\Course\Entity\Course\StatusType

            question_form: App\Course\Entity\Course\QuestionFormType

            test_id: App\Testing\Entity\Test\TestIdType
            test_status: App\Testing\Entity\Test\StatusType

            attempt_id: App\Testing\Entity\Attempt\AttemptIdType
            attempt_status: App\Testing\Entity\Attempt\StatusType
            attempt_answer_id: App\Testing\Entity\Attempt\AnswerIdType

            category_id: App\Testing\Entity\Category\CategoryIdType

            profile_id: App\Profile\Entity\Profile\ProfileIdType
            profile_status: App\Profile\Entity\Profile\StatusType
            profile_role: App\Profile\Entity\Profile\RoleType
            profile_email: App\Profile\Entity\Profile\EmailType

            subscription_id: App\Subscription\Entity\Subscription\SubscriptionIdType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Auth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Entity'
                prefix: 'App\Auth\Entity'
                alias: Auth
            OAuth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/OAuth/Entity'
                prefix: 'App\OAuth\Entity'
                alias: OAuth
            Parser:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Parser/Entity'
                prefix: 'App\Parser\Entity'
                alias: Parser
            Task:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Parser/Entity'
                prefix: 'App\Parser\Entity'
                alias: ParserTask
            Course:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Course/Entity'
                prefix: 'App\Course\Entity'
                alias: TestingCourse
            Test:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Testing/Entity'
                prefix: 'App\Testing\Entity'
                alias: Test
            Profile:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Profile/Entity'
                prefix: 'App\Profile\Entity'
                alias: Profile
            Subscription:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Subscription/Entity'
                prefix: 'App\Subscription\Entity'
                alias: Subscription



when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            #dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
